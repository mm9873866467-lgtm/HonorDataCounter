
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: |
          unzip HonorDataCounter_Source.zip -d project
          test -f project/HonorDataCounter/app/build.gradle.kts
          gradle --no-daemon -p project/HonorDataCounter :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HonorDataCounter-APK
          path: project/HonorDataCounter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
